<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Rotation Matrix Visualizer</title>
    <style>
        /* CSS: This handles the styling and layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Flexbox is used here to put the canvas and controls side-by-side */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            justify-content: center;
        }

        .canvas-container {
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 320px;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            background: #eef2f5;
            border-radius: 8px;
        }

        label {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .data-section {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #444;
        }

        /* Styling for the 2x2 Matrix to make it look like math */
        .matrix-display {
            font-family: 'Courier New', Courier, monospace;
            background: #282c34;
            color: #61afef;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.4rem;
            line-height: 1.5;
            letter-spacing: 2px;
        }

        .coordinate-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Rigid Body Rotation Visualizer</h1>

    <div class="container">
        <div class="canvas-container">
            <canvas id="visualizerCanvas" width="500" height="500"></canvas>
        </div>
        
        <div class="controls">
            
            <div class="slider-container">
                <label for="angleSlider">Rotation Angle (&theta;): <span id="angleValue">0&deg;</span></label>
                <input type="range" id="angleSlider" min="0" max="360" value="0">
            </div>
            
            <div class="data-section">
                <h3>Rotation Matrix (Ground to Body)</h3>
                <div class="matrix-display" id="matrixDisplay">
                    [ 1.00,  0.00 ]<br>
                    [ 0.00,  1.00 ]
                </div>
            </div>

            <div class="data-section">
                <h3>Reference Point Coordinates</h3>
                <p>Body Frame (Fixed): <span class="coordinate-text">(2.00, 2.00)</span></p>
                <p>Ground Frame: <span class="coordinate-text" id="groundCoords">(2.00, 2.00)</span></p>
            </div>

        </div>
    </div>
    <script>
        // 1. Grab the elements from our HTML
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        const angleSlider = document.getElementById('angleSlider');
        const angleValueDisplay = document.getElementById('angleValue');
        const matrixDisplay = document.getElementById('matrixDisplay');
        const groundCoordsDisplay = document.getElementById('groundCoords');

        // Reference Point P in the Body Frame (fixed)
        const P_body = { x: 2, y: 2 };
        const scale = 50; // Scales the math units to pixels (1 unit = 50px)

        // 2. The main function to draw everything and do the math
        function updateVisualizer() {
            // Get the current angle from the slider and convert to radians
            const degrees = parseInt(angleSlider.value);
            const theta = degrees * (Math.PI / 180);

            // Update the text showing the current angle
            angleValueDisplay.innerHTML = `${degrees}&deg;`;

            // Calculate the Rotation Matrix elements
            const cosT = Math.cos(theta);
            const sinT = Math.sin(theta);

            // Update the Matrix HTML display
            matrixDisplay.innerHTML = `
                [ ${cosT.toFixed(2)}, ${(-sinT).toFixed(2)} ]<br>
                [ ${sinT.toFixed(2)},  ${cosT.toFixed(2)} ]
            `;

            // Calculate Point P in Ground Frame (Matrix Multiplication)
            const P_ground_x = (cosT * P_body.x) + (-sinT * P_body.y);
            const P_ground_y = (sinT * P_body.x) + (cosT * P_body.y);
            
            // Update the Coordinate HTML display
            groundCoordsDisplay.innerText = `(${P_ground_x.toFixed(2)}, ${P_ground_y.toFixed(2)})`;

            // --- DRAWING ON THE CANVAS ---
            // Clear the canvas for the new frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Move the origin (0,0) to the center of the canvas
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            
            // Note: In Canvas API, Y goes down. We flip it so Y goes up like standard math
            ctx.scale(1, -1); 

            // Draw Ground Frame (Fixed)
            drawAxes('black', 'xg', 'yg');

            // Draw Body Frame (Rotated)
            ctx.save();
            ctx.rotate(theta);
            drawAxes('blue', 'xb', 'yb');
            
            // Draw Point P (fixed in the rotating body frame)
            ctx.beginPath();
            ctx.arc(P_body.x * scale, P_body.y * scale, 6, 0, 2 * Math.PI);
            ctx.fillStyle = 'red';
            ctx.fill();
            ctx.restore(); // Restore back to ground frame orientation

            ctx.restore(); // Restore origin back to top-left
        }

        // Helper function to draw axes
        function drawAxes(color, xLabel, yLabel) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;
            ctx.font = '16px Arial';

            // X Axis
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(200, 0);
            ctx.stroke();
            
            // Y Axis
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, 200);
            ctx.stroke();
        }

        // 3. Listen for slider movement to trigger the update
        angleSlider.addEventListener('input', updateVisualizer);

        // 4. Run once on page load to draw the initial state
        updateVisualizer();
    </script>
</body>
</html>
