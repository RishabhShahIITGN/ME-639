<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotation Matrix Visualizer</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            justify-content: center;
            max-width: 1000px;
        }

        .canvas-container {
            border: 2px solid #ddd;
            border-radius: 8px;
            background-color: #1e1e1e;
            overflow: hidden;
            width: 500px;
            height: 500px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 350px;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 15px;
            background: #eef2f5;
            border-radius: 8px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .slider-row input {
            flex-grow: 1;
            margin: 0 10px;
        }

        label {
            font-weight: bold;
            min-width: 100px;
        }

        .val-display {
            min-width: 45px;
            text-align: right;
            font-family: monospace;
            font-size: 1.1rem;
        }

        .data-section {
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: #444;
        }

        .matrix-display {
            font-family: 'Courier New', Courier, monospace;
            background: #282c34;
            color: #61afef;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.3rem;
            line-height: 1.8;
            letter-spacing: 2px;
            white-space: pre;
        }

        .legend {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            justify-content: center;
            margin-top: 10px;
        }
        .legend span { padding: 4px 8px; border-radius: 4px; }
        .x-axis { background: #ffcccc; color: #cc0000; }
        .y-axis { background: #ccffcc; color: #008800; }
        .z-axis { background: #ccccff; color: #0000cc; }
    </style>
</head>
<body>

    <h1>3D Rigid Body Rotation Visualizer</h1>

    <div class="container">
        <div class="canvas-container" id="canvasContainer">
            </div>
        
        <div class="controls">
            
            <div class="slider-group">
                <h3>Euler Angles (Degrees)</h3>
                
                <div class="slider-row">
                    <label style="color: #ff3333;">Roll (X):</label>
                    <input type="range" id="xSlider" min="-180" max="180" value="0">
                    <span class="val-display" id="xVal">0&deg;</span>
                </div>
                
                <div class="slider-row">
                    <label style="color: #33cc33;">Pitch (Y):</label>
                    <input type="range" id="ySlider" min="-180" max="180" value="0">
                    <span class="val-display" id="yVal">0&deg;</span>
                </div>
                
                <div class="slider-row">
                    <label style="color: #3366ff;">Yaw (Z):</label>
                    <input type="range" id="zSlider" min="-180" max="180" value="0">
                    <span class="val-display" id="zVal">0&deg;</span>
                </div>

                <div class="legend">
                    <span class="x-axis">X Axis (Red)</span>
                    <span class="y-axis">Y Axis (Green)</span>
                    <span class="z-axis">Z Axis (Blue)</span>
                </div>
                <p style="font-size: 0.8rem; text-align: center; margin-bottom: 0;"><em>Tip: Click and drag the 3D canvas to rotate the camera.</em></p>
            </div>
            
            <div class="data-section">
                <h3>3x3 Rotation Matrix</h3>
                <div class="matrix-display" id="matrixDisplay">
[ 1.00,  0.00,  0.00 ]
[ 0.00,  1.00,  0.00 ]
[ 0.00,  0.00,  1.00 ]
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 1. SETUP THREE.JS SCENE ---
        const container = document.getElementById('canvasContainer');
        const scene = new THREE.Scene();
        
        // Add a grid for spatial reference
        const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
        scene.add(gridHelper);

        // Setup Camera
        const camera = new THREE.PerspectiveCamera(50, 500 / 500, 0.1, 1000);
        camera.position.set(4, 4, 6); // Position camera diagonally above

        // Setup Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(500, 500);
        container.appendChild(renderer.domElement);

        // Setup OrbitControls (Mouse interaction)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- 2. CREATE COORDINATE FRAMES ---
        
        // Global Frame (Fixed, semi-transparent)
        const globalAxes = new THREE.AxesHelper(4);
        globalAxes.material.transparent = true;
        globalAxes.material.opacity = 0.3;
        scene.add(globalAxes);

        // Body Frame (Rotating)
        const bodyAxes = new THREE.AxesHelper(3);
        // Make the body axes thicker for visibility
        bodyAxes.material.linewidth = 3; 
        scene.add(bodyAxes);

        // --- 3. UI AND MATH LOGIC ---
        
        const xSlider = document.getElementById('xSlider');
        const ySlider = document.getElementById('ySlider');
        const zSlider = document.getElementById('zSlider');
        
        const xVal = document.getElementById('xVal');
        const yVal = document.getElementById('yVal');
        const zVal = document.getElementById('zVal');
        
        const matrixDisplay = document.getElementById('matrixDisplay');

        function updateRotation() {
            // Get values from sliders
            const degX = parseFloat(xSlider.value);
            const degY = parseFloat(ySlider.value);
            const degZ = parseFloat(zSlider.value);

            // Update text displays
            xVal.innerHTML = `${degX}&deg;`;
            yVal.innerHTML = `${degY}&deg;`;
            zVal.innerHTML = `${degZ}&deg;`;

            // Convert degrees to radians for math
            const radX = THREE.MathUtils.degToRad(degX);
            const radY = THREE.MathUtils.degToRad(degY);
            const radZ = THREE.MathUtils.degToRad(degZ);

            // Apply rotations to the body frame (Order: XYZ)
            bodyAxes.rotation.set(radX, radY, radZ, 'XYZ');

            // Force Three.js to update the matrix calculations immediately
            bodyAxes.updateMatrixWorld();

            // Extract the 4x4 matrix from Three.js and format as 3x3
            // Three.js stores matrices as 1D arrays in column-major order
            const e = bodyAxes.matrixWorld.elements;
            
            // Format the output string
            const mText = `[ ${e[0].toFixed(2).padStart(5)}, ${e[4].toFixed(2).padStart(5)}, ${e[8].toFixed(2).padStart(5)} ]\n` +
                          `[ ${e[1].toFixed(2).padStart(5)}, ${e[5].toFixed(2).padStart(5)}, ${e[9].toFixed(2).padStart(5)} ]\n` +
                          `[ ${e[2].toFixed(2).padStart(5)}, ${e[6].toFixed(2).padStart(5)}, ${e[10].toFixed(2).padStart(5)} ]`;
            
            matrixDisplay.innerText = mText;
        }

        // Add event listeners to sliders
        xSlider.addEventListener('input', updateRotation);
        ySlider.addEventListener('input', updateRotation);
        zSlider.addEventListener('input', updateRotation);

        // --- 4. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Required for OrbitControls damping
            renderer.render(scene, camera);
        }

        // Initialize and start loop
        updateRotation();
        animate();
    </script>
</body>
</html>
